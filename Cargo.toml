[workspace]
resolver = "3"
members = ["apps/xemss", "crates/victory-pe", "crates/victory-shader"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
miniz_oxide = "0.9.1"
object = { version = "0.41.0", default-features = false, features = ["read_core", "pe", "coff", "archive", "std"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
windows = "0.62.2"
windows-sys = "0.61.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = "line-tables-only"
